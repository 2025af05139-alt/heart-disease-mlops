name: Heart Disease MLOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    name: Lint, Test and Train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create output directories
        run: |
          mkdir -p test-results
          mkdir -p artifacts/models
          mkdir -p reports/figures
          mkdir -p mlartifacts

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run automated tests
        run: python -m pytest -q --junitxml=test-results/junit.xml

      - name: Download and preprocess dataset
        run: python -m src.data

      - name: Generate EDA reports
        run: python -m src.eda

      - name: Train and evaluate models
        run: python -m src.train

      - name: Upload test results, models and MLflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heart-disease-mlops-run-${{ github.run_number }}
          path: |
            test-results/junit.xml
            artifacts/models/
            reports/
            mlflow.db
            mlartifacts/
          if-no-files-found: warn
          retention-days: 14
